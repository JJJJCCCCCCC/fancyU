global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: sysudate-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9091"]

  - job_name: sysudate-ai
    metrics_path: /metrics
    static_configs:
      - targets: ["ai-service:8000"]
