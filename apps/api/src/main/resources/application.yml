spring:
  application:
    name: sysudate-api
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s

sysudate:
  admin:
    username: ${ADMIN_USERNAME:mony}
    password: ${ADMIN_PASSWORD:local-admin-password-change-me}
  security:
    jwt-secret: ${JWT_SECRET:local-development-jwt-secret-change-me-0001}
    service-jwt-secret: ${SERVICE_JWT_SECRET:local-development-service-jwt-secret-0001}
    access-token-ttl: 30d
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    verification-hmac-secret: ${VERIFICATION_HMAC_SECRET:local-development-verification-secret-0001}
  notification:
    publisher-enabled: ${NOTIFICATION_PUBLISHER_ENABLED:false}
    email-enabled: ${EMAIL_DELIVERY_ENABLED:false}
    from: ${MAIL_FROM:no-reply@sysudate.local}
  ai:
    base-url: ${AI_SERVICE_URL:http://ai-service:8000}
    timeout: ${AI_SERVICE_TIMEOUT:10s}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
