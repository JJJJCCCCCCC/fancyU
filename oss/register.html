<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyU · 注册</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #00552E 0%, #00853E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #00552E;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #00853E;
        }
        .form-group .hint {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        .form-group .hint.error {
            color: #c62828;
        }
        .form-group .hint.success {
            color: #2e7d32;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #00853E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #006B30; }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: #666;
            margin-top: 10px;
        }
        .btn-secondary:hover { background: #555; }
        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }
        .links a {
            color: #00853E;
            text-decoration: none;
            margin: 0 10px;
        }
        .links a:hover { text-decoration: underline; }
        .msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .msg.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        .msg.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .code-group {
            display: flex;
            gap: 10px;
        }
        .code-group input {
            flex: 1;
        }
        .code-group button {
            white-space: nowrap;
            padding: 12px 16px;
            background: #00552E;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .code-group button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }
        .step-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #e0e0e0;
            margin: 0 5px;
        }
        .step-dot.active {
            background: #00853E;
        }

        /* ========== 平板适配 ========== */
        @media (max-width: 768px) {
            .container { padding: 36px 28px; max-width: 420px; }
            .logo h1 { font-size: 26px; }
        }

        /* ========== 小屏手机 ========== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 28px 20px; border-radius: 14px; }
            .logo { margin-bottom: 24px; }
            .logo h1 { font-size: 24px; }
            .logo p { font-size: 13px; }
            .step-indicator { margin-bottom: 20px; }
            .step-dot { width: 8px; height: 8px; margin: 0 4px; }
            .form-group { margin-bottom: 16px; }
            .form-group label { font-size: 13px; margin-bottom: 6px; }
            .form-group input, .form-group select { padding: 12px 14px; font-size: 16px; min-height: 48px; }
            .btn { padding: 14px; font-size: 16px; min-height: 52px; }
            .email-row { flex-direction: column !important; gap: 6px !important; }
            .email-row input, .email-row select { width: 100%; min-width: auto; }
            .code-group { flex-direction: column; gap: 8px; }
            .code-group button { width: 100%; padding: 12px; }
            .links { margin-top: 20px; font-size: 13px; }
            .hint { font-size: 11px; }
        }

        /* ========== 超小屏 ========== */
        @media (max-width: 360px) {
            .container { padding: 24px 16px; }
            .logo h1 { font-size: 22px; }
            .form-group input { padding: 10px 12px; }
            .btn { padding: 12px; font-size: 15px; }
        }

        /* ========== 暗色模式 ========== */
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #001a0f 0%, #00331a 100%); }
            .container { background: #1a2e24; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
            .logo h1 { color: #4ade80; }
            .logo p { color: #a8b8ae; }
            .form-group label { color: #c8d8ce; }
            .form-group input, .form-group select {
                background: #0f1a14;
                border-color: #2a4a3a;
                color: #e8f0eb;
            }
            .form-group input:focus { border-color: #4ade80; }
            .btn { background: #00853E; }
            .btn:hover { background: #006B30; }
            .btn-secondary { background: #555; }
            .btn-secondary:hover { background: #444; }
            .links a { color: #4ade80; }
            .hint { color: #6a7a70; }
            .step-dot { background: #2a4a3a; }
            .step-dot.active { background: #4ade80; }
            .msg.error { background: rgba(220, 53, 69, 0.15); }
            .msg.success { background: rgba(46, 125, 50, 0.15); }
            .code-group button { background: #00552E; }
            .code-group button:disabled { background: #333; }
        }

        /* ========== 减少动画 ========== */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>FancyU</h1>
            <p>注册新账号</p>
        </div>
        
        <div class="step-indicator">
            <div class="step-dot active" id="dot1"></div>
            <div class="step-dot" id="dot2"></div>
            <div class="step-dot" id="dot3"></div>
        </div>
        
        <div id="msg" class="msg"></div>
        
        <!-- 步骤1：验证邮箱 -->
        <div class="step active" id="step1">
            <form id="emailForm">
                <div class="form-group">
                    <label for="emailPrefix">学校邮箱</label>
                    <div class="email-row" style="display:flex;gap:8px;">
                        <input type="text" id="emailPrefix" placeholder="输入邮箱前缀" required style="flex:1;">
                        <select id="emailDomain" style="padding:12px;border:2px solid #e0e0e0;border-radius:8px;font-size:14px;min-width:180px;">
                            <option value="@mail.sysu.edu.cn">@mail.sysu.edu.cn</option>
                            <option value="@mail2.sysu.edu.cn">@mail2.sysu.edu.cn</option>
                            <option value="@scut.edu.cn">@scut.edu.cn</option>
                        </select>
                    </div>
                    <div class="hint">仅支持指定学校官方邮箱</div>
                </div>
                <button type="submit" class="btn" id="sendCodeBtn">发送验证码</button>
            </form>
        </div>
        
        <!-- 步骤2：输入验证码 -->
        <div class="step" id="step2">
            <form id="codeForm">
                <div class="form-group">
                    <label for="code">验证码</label>
                    <input type="text" id="code" placeholder="输入6位验证码" maxlength="6" required>
                </div>
                <button type="submit" class="btn">验证</button>
            </form>
        </div>
        
        <!-- 步骤3：设置密码 -->
        <div class="step" id="step3">
            <form id="passwordForm">
                <div class="form-group">
                    <label for="username">用户名（可选）</label>
                    <input type="text" id="username" placeholder="自定义用户名，默认为邮箱前缀">
                    <div class="hint" id="usernameHint">2-20个字符，留空则使用邮箱前缀</div>
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" placeholder="至少6位" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                </div>
                <button type="submit" class="btn">完成注册</button>
            </form>
        </div>
        
        <div class="links">
            <a href="login.html">已有账号？登录</a>
            <span style="color:#999">|</span>
            <a href="bind.html">绑定序列号</a>
        </div>
        
        <div class="links" style="margin-top:12px">
            <a href="index.html">返回首页</a>
        </div>
    </div>
    
    <script>
        const API_BASE = 'https://sysudate-data-rumzgdjkdp.cn-hangzhou.fcapp.run';
        let email = '';
        let code = '';
        let usernameAvailable = true;
        let checkUsernameTimer = null;
        
        const SCHOOL_MAP = {
            '@mail.sysu.edu.cn': { key: 'sysu', name: '中山大学' },
            '@mail2.sysu.edu.cn': { key: 'sysu', name: '中山大学' },
            '@scut.edu.cn': { key: 'scut', name: '华南理工大学' }
        };
        
        document.getElementById('username').addEventListener('input', (e) => {
            const val = e.target.value.trim();
            const hint = document.getElementById('usernameHint');
            clearTimeout(checkUsernameTimer);
            
            if (!val) {
                hint.textContent = '2-20个字符，留空则使用邮箱前缀';
                hint.className = 'hint';
                usernameAvailable = true;
                return;
            }
            if (val.length < 2) {
                hint.textContent = '用户名至少2个字符';
                hint.className = 'hint error';
                usernameAvailable = false;
                return;
            }
            if (val.length > 20) {
                hint.textContent = '用户名不能超过20个字符';
                hint.className = 'hint error';
                usernameAvailable = false;
                return;
            }
            
            hint.textContent = '检查中...';
            hint.className = 'hint';
            usernameAvailable = false;
            
            checkUsernameTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`${API_BASE}/account/check-username?username=${encodeURIComponent(val)}`);
                    const data = await res.json();
                    if (data.code === 200) {
                        usernameAvailable = data.available;
                        hint.textContent = data.msg;
                        hint.className = 'hint ' + (data.available ? 'success' : 'error');
                    }
                } catch (err) {
                    hint.textContent = '检查失败，请稍后重试';
                    hint.className = 'hint error';
                }
            }, 500);
        });
        
        function showMsg(text, type) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }
        
        function goToStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            for (let i = 1; i <= 3; i++) {
                document.getElementById('dot' + i).classList.toggle('active', i <= step);
            }
        }
        
        // 步骤1：发送验证码
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const prefix = document.getElementById('emailPrefix').value.trim();
            const domain = document.getElementById('emailDomain').value;
            email = prefix + domain;
            
            if (!prefix) {
                showMsg('请输入邮箱前缀', 'error');
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            btn.textContent = '发送中...';
            
            try {
                const res = await fetch(API_BASE + '/account/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'register' })
                });
                
                const data = await res.json();
                
                if (data.code === 200) {
                    showMsg('验证码已发送，请查收邮件', 'success');
                    goToStep(2);
                    
                    let countdown = 60;
                    btn.textContent = countdown + 's';
                    const timer = setInterval(() => {
                        countdown--;
                        btn.textContent = countdown + 's';
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.textContent = '重新发送';
                        }
                    }, 1000);
                } else {
                    showMsg(data.msg, 'error');
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                }
            } catch (err) {
                showMsg('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '发送验证码';
            }
        });
        
        // 步骤2：验证验证码
        document.getElementById('codeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            code = document.getElementById('code').value.trim();
            
            if (code.length !== 6) {
                showMsg('请输入6位验证码', 'error');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '验证中...';
            
            try {
                const res = await fetch(API_BASE + '/account/check-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code })
                });
                
                const data = await res.json();
                
                if (data.code === 200) {
                    showMsg('验证通过，请设置密码', 'success');
                    goToStep(3);
                } else {
                    showMsg(data.msg, 'error');
                    btn.disabled = false;
                    btn.textContent = '验证';
                }
            } catch (err) {
                showMsg('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '验证';
            }
        });
        
        // 步骤3：注册
        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                showMsg('两次密码不一致', 'error');
                return;
            }
            
            if (password.length < 6) {
                showMsg('密码长度至少为6位', 'error');
                return;
            }
            
            if (!usernameAvailable) {
                showMsg('用户名不可用，请修改', 'error');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = '注册中...';
            
            try {
                const res = await fetch(API_BASE + '/account/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password, username, nickname: username })
                });
                
                const data = await res.json();
                
                if (data.code === 200) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    showMsg('注册成功，正在跳转...', 'success');
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
                        // 防止开放重定向攻击
                        const safeRedirect = redirect.startsWith('http') ? 'index.html' : redirect;
                        window.location.href = safeRedirect;
                    }, 1000);
                } else {
                    showMsg(data.msg, 'error');
                    btn.disabled = false;
                    btn.textContent = '完成注册';
                }
            } catch (err) {
                showMsg('网络错误，请稍后重试', 'error');
                btn.disabled = false;
                btn.textContent = '完成注册';
            }
        });
    </script>
</body>
</html>
