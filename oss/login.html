<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FancyU | 中意你 · 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans SC', sans-serif;
            background: linear-gradient(135deg, #00552E 0%, #00853E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo h1 {
            color: #00552E;
            font-size: 28px;
            margin-bottom: 8px;
            font-family: 'Noto Serif SC', serif;
        }
        .logo p {
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #00853E;
        }
        .email-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .email-group input {
            flex: 1;
        }
        .email-group select {
            width: auto;
            min-width: 180px;
            padding: 12px 8px;
        }
        .email-group .at-sign {
            color: #666;
            font-size: 16px;
            font-weight: 500;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #00853E;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover { background: #006B30; }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .links {
            margin-top: 24px;
            text-align: center;
            font-size: 14px;
        }
        .links a, .links button {
            color: #00853E;
            text-decoration: none;
            margin: 0 10px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-family: inherit;
        }
        .links a:hover, .links button:hover { text-decoration: underline; }
        .msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .msg.error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        .msg.success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .divider {
            border-top: 1px solid #e0e0e0;
            margin: 24px 0;
        }
        .school-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 8px;
            font-weight: 500;
        }
        .school-tag.sysu {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .school-tag.scut {
            background: #fff3e0;
            color: #e65100;
        }

        /* 弹窗样式 */
        .modal-mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            padding: 20px;
        }
        .modal-mask.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.2);
            animation: modalIn 0.3s ease;
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(24px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-close-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 32px;
            height: 32px;
            border: none;
            background: #f5f5f5;
            color: #666;
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .modal-close-btn:hover {
            background: #e8f5e9;
            color: #00853E;
        }
        .modal-title {
            font-family: 'Noto Serif SC', serif;
            font-size: 22px;
            color: #00552E;
            margin-bottom: 24px;
            text-align: center;
            font-weight: 700;
        }
        .code-input-group {
            display: flex;
            gap: 12px;
        }
        .send-code-btn {
            padding: 0 16px;
            background: #00853E;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            color: white;
            transition: all 0.3s;
            font-size: 14px;
            font-family: inherit;
        }
        .send-code-btn:hover:not(:disabled) {
            background: #006B30;
        }
        .send-code-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .modal-btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .modal-btn {
            flex: 1;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-size: 15px;
            transition: all 0.3s;
            font-family: inherit;
        }
        .cancel-btn {
            background: #f5f5f5;
            color: #666;
        }
        .cancel-btn:hover {
            background: #e8f5e9;
            color: #00853E;
        }
        .confirm-btn {
            background: #00853E;
            color: white;
        }
        .confirm-btn:hover {
            background: #006B30;
        }
        .legacy-note {
            text-align: center;
            font-size: 12px;
            color: #999;
            margin-top: 16px;
        }
        .legacy-note a {
            color: #999;
            text-decoration: underline;
        }
        /* ========== 平板适配 ========== */
        @media (max-width: 768px) {
            .container { padding: 36px 28px; max-width: 420px; }
            .logo h1 { font-size: 26px; }
            .modal-content { padding: 28px; max-width: 400px; }
        }

        /* ========== 小屏手机 ========== */
        @media (max-width: 480px) {
            body { padding: 12px; }
            .container { padding: 28px 20px; border-radius: 14px; }
            .logo { margin-bottom: 24px; }
            .logo h1 { font-size: 24px; }
            .logo p { font-size: 13px; }
            .form-group { margin-bottom: 16px; }
            .form-group label { font-size: 13px; margin-bottom: 6px; }
            .form-group input, .form-group select { padding: 12px 14px; font-size: 16px; min-height: 48px; }
            .btn { padding: 14px; font-size: 16px; min-height: 52px; }
            .email-group { flex-direction: column; gap: 6px; }
            .email-group .at-sign { display: none; }
            .email-group input, .email-group select { width: 100%; }
            .links { margin-top: 20px; font-size: 13px; }
            .divider { margin: 20px 0; }
            .modal-content { padding: 24px 20px; margin: 0 12px; max-height: 92vh; }
            .modal-title { font-size: 20px; margin-bottom: 20px; }
            .modal-close-btn { top: 12px; right: 12px; width: 28px; height: 28px; font-size: 18px; }
            .code-input-group { flex-direction: column; gap: 8px; }
            .send-code-btn { padding: 12px 14px; width: 100%; font-size: 14px; }
            .modal-btn-group { flex-direction: column; gap: 8px; }
            .modal-btn { padding: 12px 0; }
            .school-tag { font-size: 11px; padding: 2px 6px; }
        }

        /* ========== 超小屏 ========== */
        @media (max-width: 360px) {
            .container { padding: 24px 16px; }
            .logo h1 { font-size: 22px; }
            .form-group input, .form-group select { padding: 10px 12px; }
            .btn { padding: 12px; font-size: 15px; }
        }

        /* ========== 暗色模式 ========== */
        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #001a0f 0%, #00331a 100%); }
            .container { background: #1a2e24; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
            .logo h1 { color: #4ade80; }
            .logo p { color: #a8b8ae; }
            .form-group label { color: #c8d8ce; }
            .form-group input, .form-group select {
                background: #0f1a14;
                border-color: #2a4a3a;
                color: #e8f0eb;
            }
            .form-group input:focus, .form-group select:focus { border-color: #4ade80; }
            .links a, .links button { color: #4ade80; }
            .legacy-note { color: #6a7a70; }
            .legacy-note a { color: #6a7a70; }
            .modal-content { background: #1a2e24; }
            .modal-title { color: #4ade80; }
            .modal-close-btn { background: #0f1a14; color: #7a8a8e; }
            .modal-close-btn:hover { background: #2a4a3a; color: #4ade80; }
            .cancel-btn { background: #0f1a14; color: #a8b8ae; }
            .msg.error { background: rgba(220, 53, 69, 0.15); }
            .msg.success { background: rgba(46, 125, 50, 0.15); }
        }

        /* ========== 减少动画 ========== */
        @media (prefers-reduced-motion: reduce) {
            * { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>FancyU | 中意你</h1>
            <p>校园恋爱交友平台</p>
        </div>
        
        <div id="msg" class="msg"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="login">邮箱 / 用户名</label>
                <input type="text" id="login" placeholder="输入邮箱或用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="输入密码" required>
            </div>
            <button type="submit" class="btn" id="submitBtn">登录</button>
        </form>
        
        <div class="links">
            <button type="button" onclick="openRegisterModal()">注册新账号</button>
            <span style="color:#999">|</span>
            <button type="button" onclick="openForgotModal()">忘记密码</button>
        </div>
        
        <div class="divider"></div>
        
        <div class="links">
            <a href="index.html">返回首页</a>
        </div>
        
        <div class="legacy-note">
            <a href="bind.html">绑定序列号</a> · <a href="modify.html">用序列号修改资料</a>
            <br><span style="font-size:11px">（兼容旧数据）</span>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div class="modal-mask" id="registerModal">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeAllModals()">×</button>
            <div class="modal-title">注册账号</div>
            <div id="registerMsg" class="msg"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>昵称</label>
                    <input type="text" id="regNickname" placeholder="给自己起个昵称" required>
                </div>
                <div class="form-group">
                    <label>学校邮箱 <span id="schoolTag"></span></label>
                    <div class="email-group">
                        <input type="text" id="regEmailPrefix" placeholder="邮箱前缀" required>
                        <span class="at-sign">@</span>
                        <select id="regEmailDomain" required>
                            <option value="">选择后缀</option>
                            <option value="mail.sysu.edu.cn">mail.sysu.edu.cn</option>
                            <option value="mail2.sysu.edu.cn">mail2.sysu.edu.cn</option>
                            <option value="scut.edu.cn">scut.edu.cn</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="regPassword" placeholder="设置密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="regPasswordConfirm" placeholder="再次输入密码" required>
                </div>
                <div class="form-group">
                    <label>验证码</label>
                    <div class="code-input-group">
                        <input type="text" id="regCode" placeholder="6位验证码" maxlength="6" style="flex:1;">
                        <button type="button" class="send-code-btn" id="regSendCodeBtn" onclick="sendRegisterCode()">发送验证码</button>
                    </div>
                </div>
                <button type="submit" class="btn" id="registerBtn">注册</button>
            </form>
        </div>
    </div>

    <!-- 忘记密码弹窗 -->
    <div class="modal-mask" id="forgotModal">
        <div class="modal-content">
            <button class="modal-close-btn" onclick="closeAllModals()">×</button>
            <div class="modal-title">重置密码</div>
            <div id="forgotMsg" class="msg"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label>注册邮箱</label>
                    <div class="email-group">
                        <input type="text" id="forgotEmailPrefix" placeholder="邮箱前缀" required>
                        <span class="at-sign">@</span>
                        <select id="forgotEmailDomain" required>
                            <option value="">选择后缀</option>
                            <option value="mail.sysu.edu.cn">mail.sysu.edu.cn</option>
                            <option value="mail2.sysu.edu.cn">mail2.sysu.edu.cn</option>
                            <option value="scut.edu.cn">scut.edu.cn</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="forgotPassword" placeholder="新密码（至少6位）" required minlength="6">
                </div>
                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="forgotPasswordConfirm" placeholder="再次输入新密码" required>
                </div>
                <div class="form-group">
                    <label>验证码</label>
                    <div class="code-input-group">
                        <input type="text" id="forgotCode" placeholder="6位验证码" maxlength="6" style="flex:1;">
                        <button type="button" class="send-code-btn" id="forgotSendCodeBtn" onclick="sendForgotCode()">发送验证码</button>
                    </div>
                </div>
                <button type="submit" class="btn" id="forgotBtn">重置密码</button>
            </form>
        </div>
    </div>
    
    <script>
        const API_BASE = 'https://sysudate-data-rumzgdjkdp.cn-hangzhou.fcapp.run';
        
        const SCHOOL_MAP = {
            'mail.sysu.edu.cn': { name: '中山大学', key: 'sysu', class: 'sysu' },
            'mail2.sysu.edu.cn': { name: '中山大学', key: 'sysu', class: 'sysu' },
            'scut.edu.cn': { name: '华南理工大学', key: 'scut', class: 'scut' }
        };

        function showMsg(text, type, targetId = 'msg') {
            const msg = document.getElementById(targetId);
            msg.textContent = text;
            msg.className = 'msg ' + type;
        }

        function closeAllModals() {
            document.getElementById('registerModal').classList.remove('show');
            document.getElementById('forgotModal').classList.remove('show');
        }

        function openRegisterModal() {
            document.getElementById('registerModal').classList.add('show');
            document.getElementById('registerMsg').className = 'msg';
            document.getElementById('registerMsg').textContent = '';
            document.getElementById('registerForm').reset();
            updateSchoolTag();
        }

        function openForgotModal() {
            document.getElementById('forgotModal').classList.add('show');
            document.getElementById('forgotMsg').className = 'msg';
            document.getElementById('forgotMsg').textContent = '';
            document.getElementById('forgotForm').reset();
        }

        function updateSchoolTag() {
            const domain = document.getElementById('regEmailDomain').value;
            const tag = document.getElementById('schoolTag');
            if (domain && SCHOOL_MAP[domain]) {
                const s = SCHOOL_MAP[domain];
                tag.innerHTML = `<span class="school-tag ${s.class}">${s.name}</span>`;
            } else {
                tag.innerHTML = '';
            }
        }

        document.getElementById('regEmailDomain').addEventListener('change', updateSchoolTag);

        function getFullEmail(prefixId, domainId) {
            const prefix = document.getElementById(prefixId).value.trim();
            const domain = document.getElementById(domainId).value;
            if (!prefix || !domain) return '';
            return prefix + '@' + domain;
        }

        function startCountdown(btnId) {
            const btn = document.getElementById(btnId);
            let sec = 60;
            btn.disabled = true;
            btn.textContent = sec + 's';
            const timer = setInterval(() => {
                sec--;
                if (sec <= 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.textContent = '发送验证码';
                } else {
                    btn.textContent = sec + 's';
                }
            }, 1000);
        }

        async function sendRegisterCode() {
            const email = getFullEmail('regEmailPrefix', 'regEmailDomain');
            if (!email) {
                showMsg('请填写完整邮箱', 'error', 'registerMsg');
                return;
            }
            const btn = document.getElementById('regSendCodeBtn');
            btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/account/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'register' })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('验证码已发送', 'success', 'registerMsg');
                    startCountdown('regSendCodeBtn');
                } else {
                    showMsg(data.msg, 'error', 'registerMsg');
                    btn.disabled = false;
                }
            } catch (err) {
                showMsg('网络错误', 'error', 'registerMsg');
                btn.disabled = false;
            }
        }

        async function sendForgotCode() {
            const email = getFullEmail('forgotEmailPrefix', 'forgotEmailDomain');
            if (!email) {
                showMsg('请填写完整邮箱', 'error', 'forgotMsg');
                return;
            }
            const btn = document.getElementById('forgotSendCodeBtn');
            btn.disabled = true;
            try {
                const res = await fetch(API_BASE + '/account/send-code', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, type: 'reset' })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('验证码已发送', 'success', 'forgotMsg');
                    startCountdown('forgotSendCodeBtn');
                } else {
                    showMsg(data.msg, 'error', 'forgotMsg');
                    btn.disabled = false;
                }
            } catch (err) {
                showMsg('网络错误', 'error', 'forgotMsg');
                btn.disabled = false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            if (!login || !password) {
                showMsg('请填写完整信息', 'error');
                return;
            }
            btn.disabled = true;
            btn.textContent = '登录中...';
            try {
                const res = await fetch(API_BASE + '/account/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login, password })
                });
                const data = await res.json();
                if (data.code === 200) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showMsg('登录成功，正在跳转...', 'success');
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
                        // 防止开放重定向攻击
                        const safeRedirect = redirect.startsWith('http') ? 'index.html' : redirect;
                        window.location.href = safeRedirect;
                    }, 800);
                } else {
                    showMsg(data.msg, 'error');
                }
            } catch (err) {
                showMsg('网络错误，请稍后重试', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('regNickname').value.trim();
            const email = getFullEmail('regEmailPrefix', 'regEmailDomain');
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regPasswordConfirm').value;
            const code = document.getElementById('regCode').value.trim();
            const btn = document.getElementById('registerBtn');

            if (!nickname || !email || !password || !code) {
                showMsg('请填写完整信息', 'error', 'registerMsg');
                return;
            }
            if (password !== confirm) {
                showMsg('两次密码不一致', 'error', 'registerMsg');
                return;
            }
            if (password.length < 6) {
                showMsg('密码至少6位', 'error', 'registerMsg');
                return;
            }

            const domain = document.getElementById('regEmailDomain').value;
            const schoolInfo = SCHOOL_MAP[domain];

            btn.disabled = true;
            btn.textContent = '注册中...';
            try {
                const res = await fetch(API_BASE + '/account/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nickname,
                        email,
                        password,
                        code,
                        my_school: schoolInfo ? schoolInfo.key : null,
                        my_school_name: schoolInfo ? schoolInfo.name : null
                    })
                });
                const data = await res.json();
                if (data.code === 200) {
                    if (data.token) {
                        localStorage.setItem('token', data.token);
                        localStorage.setItem('user', JSON.stringify(data.user));
                    }
                    showMsg('注册成功！正在跳转...', 'success', 'registerMsg');
                    setTimeout(() => {
                        const redirect = new URLSearchParams(window.location.search).get('redirect') || 'index.html';
                        // 防止开放重定向攻击
                        const safeRedirect = redirect.startsWith('http') ? 'index.html' : redirect;
                        window.location.href = safeRedirect;
                    }, 1200);
                } else {
                    showMsg(data.msg, 'error', 'registerMsg');
                }
            } catch (err) {
                showMsg('网络错误', 'error', 'registerMsg');
            } finally {
                btn.disabled = false;
                btn.textContent = '注册';
            }
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = getFullEmail('forgotEmailPrefix', 'forgotEmailDomain');
            const password = document.getElementById('forgotPassword').value;
            const confirm = document.getElementById('forgotPasswordConfirm').value;
            const code = document.getElementById('forgotCode').value.trim();
            const btn = document.getElementById('forgotBtn');

            if (!email || !password || !code) {
                showMsg('请填写完整信息', 'error', 'forgotMsg');
                return;
            }
            if (password !== confirm) {
                showMsg('两次密码不一致', 'error', 'forgotMsg');
                return;
            }
            if (password.length < 6) {
                showMsg('密码至少6位', 'error', 'forgotMsg');
                return;
            }

            btn.disabled = true;
            btn.textContent = '处理中...';
            try {
                const res = await fetch(API_BASE + '/account/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password: password, code })
                });
                const data = await res.json();
                if (data.code === 200) {
                    showMsg('密码重置成功！请登录', 'success', 'forgotMsg');
                    setTimeout(() => {
                        closeAllModals();
                        document.getElementById('login').value = email;
                    }, 1200);
                } else {
                    showMsg(data.msg, 'error', 'forgotMsg');
                }
            } catch (err) {
                showMsg('网络错误', 'error', 'forgotMsg');
            } finally {
                btn.disabled = false;
                btn.textContent = '重置密码';
            }
        });

        document.querySelectorAll('.modal-mask').forEach(mask => {
            mask.addEventListener('click', (e) => {
                if (e.target === mask) closeAllModals();
            });
        });
    </script>
</body>
</html>
