name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/ai-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests eval
      - run: pytest -q
      - run: PYTHONPATH=. python eval/run_eval.py

  delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check_frontend.py
      - run: cp .env.compose.example .env.compose
      - run: echo 'CORS_ALLOWED_ORIGINS=http://portfolio-smoke.local' >> .env.compose
      - run: docker compose --env-file .env.compose config --quiet
      - run: docker compose --env-file .env.compose build api ai-service web
      - run: pip install -r scripts/requirements.txt
      - run: playwright install --with-deps chromium
      - run: docker compose --profile local-db --env-file .env.compose up -d --wait
      - run: python scripts/stack_smoke.py
      - run: python scripts/browser_smoke.py
      - if: always()
        run: docker compose --profile local-db --env-file .env.compose down

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
